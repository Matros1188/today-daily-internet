<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="TODAY — интернет, который живёт только сегодня.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>TODAY — интернет только сегодня</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
<header class="topbar"><button class="brand-button" id="brandBtn"><span class="brand-mark">T</span><span><b>TODAY</b><small>ТОЛЬКО СЕГОДНЯ</small></span></button><div class="top-actions"><button id="installBtn" class="icon-button hidden">＋</button><button id="profileBtn" class="profile-mini"><span id="profileAvatar">✦</span></button></div></header>
<main>
<section class="hero"><div><div class="eyebrow">СЕГОДНЯ · <span id="dateLabel">—</span></div><h1>ТВОЙ ИНТЕРНЕТ<br><em>ТОЛЬКО СЕГОДНЯ.</em></h1><p class="hero-copy">12 рубрик. Новый день. Ничего не повторяется.</p></div><div class="clock"><small>ДО ПОЛУНОЧИ</small><strong id="countdown">--:--:--</strong><span id="dayProgress">0%</span></div></section>
<section class="livebar"><span class="live-dot"></span><b id="liveCount">TODAY живёт сейчас</b><span id="liveMeta">люди приходят прямо сейчас</span><button id="notifyBtn" class="text-button">уведомлять</button></section>
<section id="dailyGrid" class="daily-grid"></section>
<section id="community" class="community section-block"><div class="section-head"><div><div class="eyebrow">ЛЮДИ СЕГОДНЯ</div><h2>Что оставили люди</h2></div><button id="peopleRefresh" class="text-button">обновить</button></div><div id="communityFeed" class="community-feed"></div></section>
<section class="section-block ranking-block"><div class="section-head"><div><div class="eyebrow">ДЕНЬ</div><h2>Кто сегодня в игре</h2></div><span class="rank-note">завтра всё с нуля</span></div><div id="leaderboard" class="leaderboard"></div></section>
<section id="mySection" class="section-block profile-section hidden"><div id="profilePanel"></div></section>
</main>
<nav class="bottom-nav"><button data-nav="home" class="active">⌂<span>TODAY</span></button><button data-nav="people">◉<span>ЛЮДИ</span></button><button data-nav="rank">♛<span>ТОП</span></button><button data-nav="me">✦<span>Я</span></button></nav>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-backdrop"></div><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="./app.js"></script></body></html>
