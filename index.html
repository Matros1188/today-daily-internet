<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="TODAY — интернет, который существует только сегодня.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>TODAY — интернет только сегодня</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <button class="brand-button" id="brandBtn" aria-label="TODAY"><span class="brand-mark">T</span><span><b>TODAY</b><small>ТОЛЬКО СЕГОДНЯ</small></span></button>
  <div class="top-actions">
    <button id="installBtn" class="icon-button hidden" aria-label="На экран">＋</button>
    <button id="profileBtn" class="profile-mini" aria-label="Профиль"><span id="profileAvatar">◉</span></button>
  </div>
</header>

<main>
<section class="day-strip">
  <div>
    <div class="tiny">СЕГОДНЯ · <span id="dateLabel">—</span></div>
    <h1 id="dayTheme">ТВОЙ ДЕНЬ В ИНТЕРНЕТЕ</h1>
  </div>
  <div class="day-time"><span id="dayProgress">0%</span><strong id="countdown">--:--:--</strong><span>до полуночи</span></div>
</section>

<section class="livebar">
  <span class="live-dot"></span><b id="liveCount">TODAY живёт сейчас</b><span id="liveMeta">обновляется в реальном времени</span>
  <button id="notifyBtn" class="text-button">Уведомлять меня</button>
</section>

<section id="dailyGrid" class="daily-grid" aria-live="polite"></section>

<section class="section-block social-block" id="peopleSection">
  <div class="section-title-row">
    <div><div class="tiny">ЛЮДИ СЕГОДНЯ</div><h2>Оставь свой след</h2></div>
    <button id="peopleRefresh" class="text-button">обновить</button>
  </div>
  <div id="composer" class="composer-card">
    <div class="composer-guest" id="guestComposer">
      <div class="composer-avatar">✦</div><div class="composer-copy"><b>Что происходит у тебя сегодня?</b><span>Одна запись. Один день.</span></div>
      <button id="joinBtn" class="primary-button">ВОЙТИ</button>
    </div>
    <div id="userComposer" class="hidden">
      <textarea id="postText" maxlength="280" placeholder="Одна мысль, фото или момент сегодняшнего дня…"></textarea>
      <div class="composer-bottom"><span id="charCount">0/280</span><label class="photo-button">📷<input id="postImage" type="file" accept="image/*" hidden></label><button id="postBtn" class="primary-button">В МИР</button></div>
    </div>
  </div>
  <div id="postsList" class="posts-grid"></div>
</section>

<section class="section-block ranking-block">
  <div class="section-title-row"><div><div class="tiny">ДЕНЬ</div><h2>Кто сегодня в игре</h2></div><span class="rank-note">завтра всё с нуля</span></div>
  <div id="leaderboard" class="leaderboard"></div>
</section>

<section class="section-block profile-section hidden" id="mySection">
  <div id="profilePanel"></div>
</section>
</main>

<nav class="bottom-nav">
  <button data-nav="home" class="active">⌂<span>TODAY</span></button>
  <button data-nav="people">◉<span>ЛЮДИ</span></button>
  <button data-nav="rank">♛<span>ТОП</span></button>
  <button data-nav="me">✦<span>Я</span></button>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-backdrop"></div><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="./app.js"></script>
</body>
</html>
