<script id="today-profile-loading-watchdog">
(() => {
  'use strict';

  const started = Date.now();
  const WAIT_MS = 20000;

  function showRecovery(root) {
    if (!root || root.dataset.todayLoadingWatchdog === 'shown') return;

    if (!root.querySelector('.today-profile-loading')) return;

    root.dataset.todayLoadingWatchdog = 'shown';

    const box = document.createElement('section');
    box.className = 'today-profile-error';
    box.setAttribute('role', 'alert');
    box.style.cssText = [
      'padding:24px',
      'margin:16px auto',
      'max-width:620px',
      'border-radius:20px',
      'border:1px solid rgba(160,170,195,.35)',
      'background:rgba(100,120,150,.10)',
      'color:inherit',
      'font:inherit'
    ].join(';');

    box.innerHTML = `
      <h2 style="margin:0 0 12px">Профиль загружается дольше обычного</h2>
      <p data-today-watchdog-message style="line-height:1.6">
        Загрузка не завершилась за 20 секунд. Проверяем, что именно не ответило.
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
        <button type="button" id="todayProfileWatchdogRetry"
          style="padding:12px 16px;border-radius:12px;cursor:pointer">
          Повторить с очисткой кэша
        </button>
        <a href="./index.html"
          style="padding:12px 16px;border-radius:12px;display:inline-flex;align-items:center">
          На главную
        </a>
      </div>
    `;

    const message = box.querySelector('[data-today-watchdog-message]');

    if (!window.supabase) {
      message.textContent =
        'Не обнаружена библиотека Supabase. Основной скрипт может не загрузиться или внешняя библиотека недоступна.';
    } else if (!window.TODAY_CONFIG?.supabaseUrl || !window.TODAY_CONFIG?.supabaseKey) {
      message.textContent =
        'Не удалось прочитать настройки config.js. Проверьте доступность конфигурации приложения.';
    } else {
      message.textContent =
        'Библиотека и конфигурация найдены, но основной экран не открылся. Возможна задержка восстановления сессии, запроса к базе или загрузки скрипта профиля.';
    }

    root.replaceChildren(box);

    box.querySelector('#todayProfileWatchdogRetry')?.addEventListener('click', () => {
      const next = new URL('./profile.html', location.href);
      next.searchParams.set('reset', '304');
      next.searchParams.set('retry', String(Date.now()));
      location.replace(next.href);
    });
  }

  function tick() {
    const root = document.getElementById('todayProfilePage');

    if (root && !root.querySelector('.today-profile-loading')) return;

    if (Date.now() - started >= WAIT_MS) {
      if (root) {
        showRecovery(root);
        return;
      }

      if (Date.now() - started > 45000) return;
    }

    setTimeout(tick, 400);
  }

  setTimeout(tick, 400);
})();
</script>
